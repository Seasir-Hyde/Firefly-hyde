$:
  # vscode 事件：专供页面中启动远程开发用
  vscode:
    - runner:
        # 自定义CPU核心数,最大支持64核
        cpus: 64
      docker:
        # 自定义开发环境
        build:
          # 指定构建镜像的 Dockerfile 文件
          #dockerfile: .ide/Dockerfile
      services:
        # 声明使用 vscode 服务
        - vscode
        # 声明在容器中支持 docker 命令
        - docker
      stages:
        - name: 环境启动时执行以下命令
          script:
        # 安装pnpm并使用pnpm安装依赖
            - npm install -g pnpm
            - pnpm i
            - pnpm docs:dev

# 云原生构建流程和自动部署
# main改成您实际的分支名称
main:
  push:
    - runner:
        cpus: 16
      services:
        - docker
        - git-clone-yyds 
    - imports: https://cnb.cool/W3C/Hyde/Firefly-Secret/-/blob/main/env.yml
      settings:
        user: ${SSH_USER} # SSH用户名（从环境变量获取，避免硬编码敏感信息）
        key: ${SSH_KEY} # SSH私钥（用于免密登录目标服务器，从环境变量获取）
        port: 22 # SSH端口（默认22）
        hosts:
          - 666.666.666.666 # 目标服务器IP（要部署到的服务器地址，实际替换自己的服务器IP）
        source: /dist # 待同步的本地文件目录（阶段3构建出的静态文件目录）
        target: /root/rsync/teek.seasir.top/dist/ # 目标服务器上的存放路径
        delete: true # 同步时删除目标路径中不存在的文件（确保目标与本地完全一致，避免冗余文件）
      docker:
        image: docker.cnb.cool/znb/images/node:22
        volumes:
          - /data/.cache:copy-on-write #声明式的构建缓存
      stages:
        - name: 构建当前项目
          script: echo -n $(date "+%Y-%m-%d %H:%M")
          exports:
            info: CUSTOM_ENV_DATE_INFO
        - name: 🖨️ 打印环境
          # if: |
          #   [ "$CNB_COMMIT_MESSAGE_TITLE" = "BUILD" ]
          script: |
            npm install -g pnpm && node -v && npm -v && yarn -v && pnpm -v
        - name: 💡 安装依赖
          # if: |
          #   [ "$CNB_COMMIT_MESSAGE_TITLE" = "BUILD" ]
          script: |
            pnpm install --registry https://registry.npmjs.org
            cd admin && pnpm install --registry https://registry.npmjs.org && cd ..
        - name: 📦️ 编译项目
          # if: |
          #   [ "$CNB_COMMIT_MESSAGE_TITLE" = "BUILD" ]
          script: |
            BUILD_ADMIN=1 pnpm build   #打包命令（包含 admin）
        - name: 🚚 部署到EdgeOne Pages
          # if: |
          #   [ "$CNB_COMMIT_MESSAGE_TITLE" = "BUILD" ]
          image: node:22
          script: npx edgeone pages deploy ./dist --name firefly-hyde --token $EDGEONE_PAGES_API_TOKEN
        - name: 🧪 部署后状态确认
          # 轮询线上构建指纹，确认线上已更新到本次构建；
          # 不通过会以非零退出码结束流水线，由 failStages 告警。
          script: npx tsx scripts/verify-deploy.ts



        #同步仓库到gitee                  
        # - name: 👉 同步仓库到gitee
        #   image: tencentcom/git-sync
        #   settings:
        #     branch: master
        #     auth_type: https
        #     username: ${GITEE_USERNAME}
        #     password: ${GITEE_ACCESS_TOKEN}
        #     target_url: https://gitee.com/SeasirHyde/teek-hyde.git
        #     # git_email: 'github-actions[bot]@users.noreply.github.com'

        # 构建知识库
        # - name: 📖 构建知识库
        #   image: cnbcool/knowledge-base
        #   settings:
        #     include:
        #       - docs/**/*.md
        #       - docs/**/*.txt

        # 发布通知到钉钉
        - name: 📢 发布通知到钉钉
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            secret: $SECRET  # 添加钉钉机器人的签名密钥
            webhook: $WEBHOOK  # 填写钉钉机器人的Webhook地址变量
            at: "199********" # 多个用分号(;)分隔
            isAtAll: true
            debug: true # 新增: 是否启用调试模式
            c_type: "markdown" # 支持: text, markdown, link, actionCard, multiActionCard, feedCard
            # 说明：这里用「标题 + 列表项」而不是引用块（>）。
            # 钉钉 markdown 会把引用块内的软换行合并成空格（行尾两空格也不生效），
            # 列表项是块级元素，每个字段才会稳定地独占一行。
            content: |
              #### 🎉 Firefly-Hyde 发布成功
              - **构建时间**: $CUSTOM_ENV_DATE_INFO
              - **构建id**: $CNB_BUILD_ID
              - **提交id**: $CNB_COMMIT_SHORT
              - **构建分支**: $CNB_BRANCH
              - **提交信息**: $CNB_COMMIT_MESSAGE_TITLE
              - **提交者**: $CNB_COMMITTER
              - **仓库地址**: [点击查看]($CNB_REPO_URL_HTTPS)
              - **我的网站**: [seasir.top](https://seasir.top/)

        - name: 📢 发布通知到飞书
          image: tencentcom/feishu-message
          settings:
            robot: $ROBOT
            msg_type: interactive
            card: |
              {
                          "elements": [
                              {
                                  "tag": "div",
                                  "text": {
                                      "tag": "lark_md",
                                      "content": "**构建时间**：$CUSTOM_ENV_DATE_INFO\n**构建id**：$CNB_BUILD_ID\n**提交id**：$CNB_COMMIT_SHORT\n**构建分支**：$CNB_BRANCH\n**提交信息**：$CNB_COMMIT_MESSAGE_TITLE\n**提交者**：$CNB_COMMITTER\n**仓库地址**：[点击访问]($CNB_REPO_URL_HTTPS)"
                                  }
                              },
                              {
                                  "actions": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "content": "访问网站 :爱慕:",
                                              "tag": "lark_md"
                                          },
                                          "url": "https://seasir.top/",
                                          "type": "default",
                                          "value": {}
                                      }
                                  ],
                                  "tag": "action"
                              }
                          ],
                          "header": {
                              "title": {
                                  "content": "🚀 Firefly-Hyde 构建成功",
                                  "tag": "plain_text"
                              }
                          }
                          }

        # 同步仓库到github（放在通知之后）
        # 说明：GitHub 是 CNB 的只读镜像，CNB 为唯一源。
        # force: true —— 镜像以 CNB 为准强制覆盖，避免下列情况导致流水线失败：
        #   1) GitHub 上残留历史提交（如已废弃的 GitHub Actions 定时任务推送的快照提交）
        #   2) 任何一次同步失败后两边分叉，后续推送变成非快进而被拒
        # force 只会丢弃 GitHub 侧的提交（内容仅为延迟快照，已由 CNB 的最新快照覆盖）。
        # 放在通知之后：镜像同步失败不影响「构建成功」通知的送达。
        - name: 👉 同步仓库到github
          image: tencentcom/git-sync
          settings:
            branch: main
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_ACCESS_TOKEN}
            target_url: https://github.com/Seasir-Hyde/Firefly-hyde.git
            force: true
            # git_email: 'github-actions[bot]@users.noreply.github.com'
      # 任一阶段失败（构建 / 部署 / 部署后校验 / GitHub 镜像同步）时执行的告警阶段
      failStages:
        - name: 🚨 发布失败通知到钉钉
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            secret: $SECRET
            webhook: $WEBHOOK
            at: "199********"
            isAtAll: true
            debug: true
            c_type: "markdown"
            # 说明：这里用「标题 + 列表项」而不是引用块（>）。
            # 钉钉 markdown 会把引用块内的软换行合并成空格（行尾两空格也不生效），
            # 列表项是块级元素，每个字段才会稳定地独占一行。
            content: |
              #### ❌ Firefly-Hyde 流水线失败
              - **失败时间**: $CUSTOM_ENV_DATE_INFO
              - **构建id**: $CNB_BUILD_ID
              - **提交id**: $CNB_COMMIT_SHORT
              - **构建分支**: $CNB_BRANCH
              - **提交信息**: $CNB_COMMIT_MESSAGE_TITLE
              - **提交者**: $CNB_COMMITTER
              - **仓库地址**: [点击查看]($CNB_REPO_URL_HTTPS)
              - **排查建议**: 构建/部署阶段看流水线日志；「部署后状态确认」失败说明线上仍是旧版本，稍后重试或手动触发一次构建；若失败步骤是「同步仓库到github」，仅代表 GitHub 镜像未更新，线上站点不受影响。
        - name: 🚨 发布失败通知到飞书
          image: tencentcom/feishu-message
          settings:
            robot: $ROBOT
            msg_type: interactive
            card: |
              {
                  "elements": [
                      {
                          "tag": "div",
                          "text": {
                              "tag": "lark_md",
                              "content": "**失败时间**：$CUSTOM_ENV_DATE_INFO\n**构建id**：$CNB_BUILD_ID\n**提交id**：$CNB_COMMIT_SHORT\n**构建分支**：$CNB_BRANCH\n**提交信息**：$CNB_COMMIT_MESSAGE_TITLE\n**提交者**：$CNB_COMMITTER\n**仓库地址**：[点击访问]($CNB_REPO_URL_HTTPS)"
                          }
                      },
                      {
                          "actions": [
                              {
                                  "tag": "button",
                                  "text": {
                                      "content": "访问网站 :爱慕:",
                                      "tag": "lark_md"
                                  },
                                  "url": "https://seasir.top/",
                                  "type": "default",
                                  "value": {}
                              }
                          ],
                          "tag": "action"
                      }
                  ],
                  "header": {
                      "title": {
                          "content": "❌ Firefly-Hyde 流水线失败",
                          "tag": "plain_text"
                      }
                  }
              }

  # ============================================================================
  # 友链延迟定时探测（每天 08:17，Asia/Shanghai）
  #
  # 流程：定时触发 → 探测全部友链 → 提交快照到 main
  #       → 自动触发上面的 push 流水线 → 构建 → 部署 EdgeOne → 状态确认
  #
  # 说明：
  #   1. 定时表达式需与 src/config/friendsProbeConfig.ts 的 cron 保持一致
  #   2. 快照提交到 main 会触发 push 流水线（正常部署，无需手动触发）
  #   3. CNB 流水线内置临时令牌 CNB_TOKEN（结束即销毁），无需额外配置访问令牌
  #   4. 探测脚本内置「整轮失败率」保护：探测器异常时整轮作废并以非零码退出
  # ============================================================================
  "crontab: 17 8 * * *":
    - name: 🔍 友链延迟定时探测
      imports: https://cnb.cool/W3C/Hyde/Firefly-Secret/-/blob/main/env.yml
      runner:
        cpus: 4
      services:
        - docker
      docker:
        image: docker.cnb.cool/znb/images/node:22
        volumes:
          - /data/.cache:copy-on-write
      stages:
        - name: 🕒 记录探测时间
          script: echo -n $(date "+%Y-%m-%d %H:%M")
          exports:
            info: CUSTOM_ENV_DATE_INFO
        - name: 💡 安装依赖
          script: |
            npm install -g pnpm && pnpm install --registry https://registry.npmjs.org
        - name: 📡 探测友链延迟
          # 含单站重试（指数退避）、请求限速、整轮失败率保护
          script: npx tsx scripts/probe-friends.ts
        - name: 📤 提交并推送快照
          script: |
            git config user.name "cnb-bot"
            git config user.email "bot@cnb.cool"
            git add src/data/friends-latency-snapshot.json
            if git diff --cached --quiet; then
              echo "快照无变化，无需提交"
              exit 0
            fi
            git commit -m "chore: refresh friend latency snapshot"
            if [ -n "$CNB_TOKEN" ]; then
              REMOTE_URL="https://cnb:${CNB_TOKEN}@cnb.cool/W3C/Hyde/Firefly-hyde.git"
            else
              REMOTE_URL="origin"
            fi
            # 探测耗时一两分钟，期间往往有人提交代码，远端 main 会领先本地，
            # 直接 push 会报 non-fast-forward（"tip of your current branch is behind"）。
            # 这里先把快照提交 rebase 到远端最新提交上再推；绝不能用 force，
            # 否则会覆盖掉期间别人的提交。
            pushed=0
            for attempt in 1 2 3; do
              if git fetch "$REMOTE_URL" main \
                 && git rebase FETCH_HEAD \
                 && git push "$REMOTE_URL" HEAD:main; then
                pushed=1
                break
              fi
              echo "第 $attempt 次推送失败，rebase 到远端最新后重试"
              git rebase --abort >/dev/null 2>&1 || true
              sleep 5
            done
            if [ "$pushed" -ne 1 ]; then
              echo "连续 3 次推送失败，放弃本轮快照提交"
              exit 1
            fi
        - name: 📊 采集探测摘要
          # 把探测脚本写出的摘要首行导出为 PROBE_SUMMARY，供后面的钉钉/飞书通知引用
          script: |
            SUMMARY_FILE="${PROBE_SUMMARY_FILE:-/tmp/firefly-friend-probe-summary.txt}"
            if [ -f "$SUMMARY_FILE" ]; then
              echo -n "$(head -n 1 "$SUMMARY_FILE")"
            else
              echo -n "探测未产出摘要，请查看流水线日志"
            fi
          exports:
            info: PROBE_SUMMARY
        - name: 📢 探测成功通知到钉钉
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            secret: $SECRET
            webhook: $WEBHOOK
            at: "199********"
            isAtAll: true
            debug: true
            c_type: "markdown"
            # 说明：这里用「标题 + 列表项」而不是引用块（>）。
            # 钉钉 markdown 会把引用块内的软换行合并成空格（行尾两空格也不生效），
            # 列表项是块级元素，每个字段才会稳定地独占一行。
            content: |
              #### 🎉 友链延迟探测成功
              - **探测时间**: $CUSTOM_ENV_DATE_INFO
              - **探测结果**: $PROBE_SUMMARY
              - **构建id**: $CNB_BUILD_ID
              - **分支**: $CNB_BRANCH
              - **仓库地址**: [点击查看]($CNB_REPO_URL_HTTPS)
              - **说明**: 延迟快照已提交到 main，自动触发构建部署，线上数据将在部署完成后生效。
        - name: 📢 探测成功通知到飞书
          image: tencentcom/feishu-message
          settings:
            robot: $ROBOT
            msg_type: interactive
            card: |
              {
                          "elements": [
                              {
                                  "tag": "div",
                                  "text": {
                                      "tag": "lark_md",
                                      "content": "**探测时间**：$CUSTOM_ENV_DATE_INFO\n**探测结果**：$PROBE_SUMMARY\n**构建id**：$CNB_BUILD_ID\n**分支**：$CNB_BRANCH\n**仓库地址**：[点击访问]($CNB_REPO_URL_HTTPS)"
                                  }
                              },
                              {
                                  "actions": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "content": "访问网站 :爱慕:",
                                              "tag": "lark_md"
                                          },
                                          "url": "https://seasir.top/",
                                          "type": "default",
                                          "value": {}
                                      }
                                  ],
                                  "tag": "action"
                              }
                          ],
                          "header": {
                              "title": {
                                  "content": "🎉 友链延迟探测成功",
                                  "tag": "plain_text"
                              }
                          }
                          }
      # 探测失败（整轮异常 / 接口不可用 / 依赖安装失败 / 推送失败）时告警
      failStages:
        - name: 📊 采集探测摘要（失败兜底）
          # 失败分支同样取摘要；探测未跑完时给出兜底文案，避免通知里是空值
          script: |
            SUMMARY_FILE="${PROBE_SUMMARY_FILE:-/tmp/firefly-friend-probe-summary.txt}"
            if [ -f "$SUMMARY_FILE" ]; then
              echo -n "$(head -n 1 "$SUMMARY_FILE")"
            else
              echo -n "探测未产出摘要（探测未执行完成，请查看流水线日志）"
            fi
          exports:
            info: PROBE_SUMMARY
        - name: 🚨 探测失败通知到钉钉
          image: tencentcom/dingtalk-bot-msg:latest
          settings:
            secret: $SECRET
            webhook: $WEBHOOK
            at: "199********"
            isAtAll: true
            debug: true
            c_type: "markdown"
            # 说明：这里用「标题 + 列表项」而不是引用块（>）。
            # 钉钉 markdown 会把引用块内的软换行合并成空格（行尾两空格也不生效），
            # 列表项是块级元素，每个字段才会稳定地独占一行。
            content: |
              #### ❌ 友链延迟探测失败
              - **探测时间**: $CUSTOM_ENV_DATE_INFO
              - **探测结果**: $PROBE_SUMMARY
              - **构建id**: $CNB_BUILD_ID
              - **分支**: $CNB_BRANCH
              - **仓库地址**: [点击查看]($CNB_REPO_URL_HTTPS)
              - **影响**: 本轮结果未写入快照，线上延迟数据保持上一轮不变；请查看流水线日志定位原因。
        - name: 🚨 探测失败通知到飞书
          image: tencentcom/feishu-message
          settings:
            robot: $ROBOT
            msg_type: interactive
            card: |
              {
                          "elements": [
                              {
                                  "tag": "div",
                                  "text": {
                                      "tag": "lark_md",
                                      "content": "**探测时间**：$CUSTOM_ENV_DATE_INFO\n**探测结果**：$PROBE_SUMMARY\n**构建id**：$CNB_BUILD_ID\n**分支**：$CNB_BRANCH\n**仓库地址**：[点击访问]($CNB_REPO_URL_HTTPS)"
                                  }
                              },
                              {
                                  "actions": [
                                      {
                                          "tag": "button",
                                          "text": {
                                              "content": "访问网站 :爱慕:",
                                              "tag": "lark_md"
                                          },
                                          "url": "https://seasir.top/",
                                          "type": "default",
                                          "value": {}
                                      }
                                  ],
                                  "tag": "action"
                              }
                          ],
                          "header": {
                              "title": {
                                  "content": "❌ 友链延迟探测失败",
                                  "tag": "plain_text"
                              }
                          }
                          }
